[project]
name = "whisperx"
version = "3.2.0"
description = "Time-Accurate Automatic Speech Recognition using Whisper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Max Bain" }
]
dependencies = [
    "torch>=2",
    "torchaudio>=2.9",
    "numpy>=2",
    "pandas==2.2.3",
    "nltk==3.9.1",
    "pyannote.audio>=4.0.0",
    "qwen-asr",
    "omegaconf>=2.3.0",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hatchling",
]

[project.scripts]
whisperx = "whisperx.transcribe:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisperx"]
